AWSTemplateFormatVersion: '2010-09-09'
Description: VPN Configurer Lambda Stack

Parameters:
  LambdaConfigBucketName:
    Type: String
    Description: S3 Bucket with source code of the lambda.
  LambdaSourceVersion:
    Type: String
    Description: Version of the lambda source code, i. g. 2.0-SNAPSHOT
  # Lambda environment variables
  EnvTgBotUsername:
    Type: String
    Description: Telegram Bot Username.
  EnvTgBotSecretTokenId:
    Type: String
    Description: Secret Id in Secret Manager for Telegram Secret Token is to be used during request authentication.
  EnvTgBotTokenSecretId:
    Type: String
    Description: Secret Id in Secret Manager for the Telegram Bot Token.
    Default: vpn-tg-bot-token
  EnvMetricsEnabled:
    Type: String
    Description: Whether the lambda emits CloudWatch metrics (EMF log lines).
    Default: "true"
  EnvConfigCacheTtlSec:
    Type: String
    Description: TTL in seconds of the config cache (when enabled) and of the webhook secret read from Secrets Manager.
    Default: "300"
  EnvConfigCacheEnabled:
    Type: String
    Description: Whether the lambda caches regions and permissions read from DynamoDB for EnvConfigCacheTtlSec.
    Default: "false"

Resources:
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub vpn-configurer-lambda-role-${AWS::Region}
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: !Sub vpn-configurer-lambda-policy-${AWS::Region}
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - 'iam:PassRole'
                Resource:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/*"
              # Permissions to manage CW logs
              - Action:
                  - "logs:CreateLogGroup"
                  - "logs:CreateLogStream"
                  - "logs:PutLogEvents"
                Effect: Allow
                Resource: "*"
              # Permissions to manage ECS instances
              - Action:
                  - "ecs:RunTask"
                  - "ecs:StopTask"
                  - "ecs:DescribeTasks"
                  - "ecs:ListTasks"
                  - "ecs:TagResource"
                  - "tag:GetResources"
                  - "ec2:DescribeNetworkInterfaces"  # public IPs of the nodes
                Effect: Allow
                Resource: "*"
              # Config table: regions, user permissions, Telegram update locks
              - Action:
                  - "dynamodb:GetItem"
                  - "dynamodb:PutItem"
                  - "dynamodb:DeleteItem"
                  - "dynamodb:Query"
                Effect: Allow
                Resource: !GetAtt ConfigTable.Arn
              - Action:
                  - 'secretsmanager:GetSecretValue'
                Effect: Allow
                Resource:
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${EnvTgBotSecretTokenId}*"
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${EnvTgBotTokenSecretId}*"

  # Regions (pk REGION), user permissions (pk USER) and Telegram update locks (pk TG_UPDATE_LOCK).
  # Retained when the stack is deleted or the table replaced: it holds the bot's configuration.
  ConfigTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: vpnbot
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  VpnConfigurerLambda:
    DependsOn:
      - LambdaRole
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: vpnbot
      Handler: org.github.akarkin1.TailscaleVpnLambdaHandler::handleRequest
      Runtime: "java21"
      Role: !GetAtt LambdaRole.Arn
      MemorySize: 1024
      # API Gateway gives up after 29 s
      Timeout: 30
      # Snapshot of the initialised JVM per published version; the alias below is what is invoked
      SnapStart:
        ApplyOn: PublishedVersions
      Environment:
        Variables:
          BOT_USERNAME: !Ref EnvTgBotUsername
          BOT_SECRET_TOKEN_ID: !Ref EnvTgBotSecretTokenId
          BOT_TOKEN_SECRET_ID: !Ref EnvTgBotTokenSecretId
          METRICS_ENABLED: !Ref EnvMetricsEnabled
          CONFIG_CACHE_TTL_SEC: !Ref EnvConfigCacheTtlSec
          CONFIG_CACHE_ENABLED: !Ref EnvConfigCacheEnabled
          CONFIG_TABLE_NAME: !Ref ConfigTable
      Code:
        S3Bucket: !Ref LambdaConfigBucketName
        S3Key: !Sub
          - 'vpntgbot/vpnbot-${LambdaSourceVersion}.jar'
          - LambdaSourceVersion: !Ref LambdaSourceVersion

  # The first published version (a snapshot of the code deployed when the stack is created or this
  # resource is renamed). Later versions are published by the workflows, which also move the alias.
  VpnConfigurerLambdaVersion:
    Type: AWS::Lambda::Version
    Properties:
      FunctionName: !Ref VpnConfigurerLambda
      Description: Published by CloudFormation

  # API Gateway invokes this alias. CloudFormation only sets its first version; every code or
  # configuration deploy publishes a new version and points the alias at it (publish-live-version.sh).
  VpnConfigurerLambdaAlias:
    Type: AWS::Lambda::Alias
    Properties:
      FunctionName: !Ref VpnConfigurerLambda
      FunctionVersion: !GetAtt VpnConfigurerLambdaVersion.Version
      Name: live

  LambdaLogGroup:
    DependsOn: VpnConfigurerLambda
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Join ['', ['/aws/lambda/', !Ref VpnConfigurerLambda]]
      RetentionInDays: 7

  # Create API Gateway
  LambdaRestApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: vpn-configurer-api
      ProtocolType: HTTP
      Description: An API Gateway with Vpn Configurer Lambda Integration

  ApiGatewayIamRole:
    DependsOn: VpnConfigurerLambda
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ""
            Effect: "Allow"
            Principal:
              Service:
                - "apigateway.amazonaws.com"
            Action:
              - "sts:AssumeRole"
      Path: "/"
      Policies:
        - PolicyName: LambdaAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Action: "lambda:InvokeFunction"
                Resource:
                  - !GetAtt VpnConfigurerLambda.Arn
                  - !Ref VpnConfigurerLambdaAlias
        - PolicyName: ApiGatewayAwsLoggingPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/apigateway/*:*
        - PolicyName: ApiGatewayCustomLoggingPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/custom/apigateway/*:*

  LambdaApiGatewayIntegration:
    DependsOn:
      - ApiGatewayIamRole
      - LambdaRestApi
      - VpnConfigurerLambdaAlias
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref LambdaRestApi
      Description: TG Bot Vpn Configurer Integration
      ConnectionType: INTERNET
      CredentialsArn: !GetAtt ApiGatewayIamRole.Arn
      PassthroughBehavior: WHEN_NO_MATCH
      TimeoutInMillis: 29000
      IntegrationMethod: POST
      IntegrationType: AWS_PROXY
      PayloadFormatVersion: "2.0"
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${VpnConfigurerLambdaAlias}/invocations"

  ApiGatewayRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn:
      - LambdaRestApi
      - VpnConfigurerLambda
      - LambdaApiGatewayIntegration
    Properties:
      ApiId: !Ref LambdaRestApi
      RouteKey: POST /vpn-configurer
      Target: !Join
        - /
        - - integrations
          - !Ref LambdaApiGatewayIntegration

  # CloudFormation never redeploys an HTTP API by itself: a Deployment is a snapshot taken when the
  # resource is created. Rename this resource (new logical id) whenever the route or integration
  # changes, otherwise the stage keeps serving the old snapshot (2026-10-10: the old 0.6 s timeout;
  # 2026-10-10b: the integration now targets the alias).
  ApiGatewayDeployment20261010b:
    DependsOn:
      - ApiGatewayRoute
      - LambdaApiGatewayIntegration
      - LambdaRestApi
    Type: AWS::ApiGatewayV2::Deployment
    Properties:
      ApiId: !Ref LambdaRestApi
      Description: TG Bot Vpn Configurer Lambda API Deployment

  ApiGatewayStage:
    DependsOn:
      - ApiGatewayDeployment20261010b
      - LambdaRestApi
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      DeploymentId: !Ref ApiGatewayDeployment20261010b
      Description: TG Bot Vpn Configurer Lambda API v0
      ApiId: !Ref LambdaRestApi
      StageName: "v0"
