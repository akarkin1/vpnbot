name: Deploy Tailscale ECS Resources

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'AWS Region'
        required: true
      cluster-name:
        description: 'Name Of ECS Cluster, where VPN Server tasks will be hosted'
        required: true
        default: tailscale-node-ecs-cluster
      repository-name:
        description: 'Name Of ECR Repository, where a Docker image with VPN Server will be stored'
        required: true
        default: tailscale-node-ecr-repo
      run-cfn-deploy:
        description: 'Do CloudFormation resources need to be deployed?'
        required: true
        default: yes
        type: choice
        options:
          - yes
          - no
      run-docker:
        description: 'Is docker build and push required?'
        required: true
        default: yes
        type: choice
        options:
          - yes
          - no

env:
  CONFIG_TABLE_NAME: vpnbot
  CONFIG_TABLE_REGION: ${{ vars.CONFIG_BASE_REGION }}
  STACK_NAME: ${{ vars.ECS_STACK_NAME }}
  TAILSCALE_AUTH_TOKEN_SECRET_ID: ${{ vars.TAILSCALE_AUTH_TOKEN_SECRET_ID }}
  TAILSCALE_AUTH_TOKEN_REGION: ${{ vars.CONFIG_BASE_REGION }}
  TG_BOT_TOKEN_SECRET_ID: ${{ vars.TG_BOT_TOKEN_SECRET_ID || 'vpn-tg-bot-token' }}

jobs:
  # ToDo: docker build and cloudformation template deployment can be run in parallel, if there is no dependency between the formers
  deploy-tailscale-node:
    name: Deploy Tailscale ECS Resources
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        if: ${{ github.event.inputs.run-docker == 'true' || github.event.inputs.run-cfn-deploy == 'true' }}
        uses: actions/checkout@v4
      - name: Configure AWS Credentials
        if: ${{ github.event.inputs.run-docker == 'true' || github.event.inputs.run-cfn-deploy == 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ github.event.inputs.region }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Load Tailscale Auth Token
        if: ${{ github.event.inputs.run-docker == 'true' || github.event.inputs.run-cfn-deploy == 'true' }}
        id: ssm-upload
        run: |
           # Create Tailscale Auth Token Secret, if needed
           if [ $(aws secretsmanager describe-secret --secret-id "${{ env.TAILSCALE_AUTH_TOKEN_SECRET_ID }}" --region ${{ env.TAILSCALE_AUTH_TOKEN_REGION }} >/dev/null 2>&1; echo $?) -ne 0 ]; then
             aws secretsmanager create-secret --name ${{ env.TAILSCALE_AUTH_TOKEN_SECRET_ID }} --secret-string "${{ secrets.TAILSCALE_AUTH_TOKEN }}" --region ${{ env.TAILSCALE_AUTH_TOKEN_REGION }};
           fi
      - name: Load TG Bot Token
        if: ${{ github.event.inputs.run-docker == 'true' || github.event.inputs.run-cfn-deploy == 'true' }}
        id: tg-bot-token-upload
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: |
           # Create Telegram Bot Token Secret, or update its value if it already exists
           if [ $(aws secretsmanager describe-secret --secret-id "${{ env.TG_BOT_TOKEN_SECRET_ID }}" --region ${{ env.TAILSCALE_AUTH_TOKEN_REGION }} >/dev/null 2>&1; echo $?) -ne 0 ]; then
             aws secretsmanager create-secret --name "${{ env.TG_BOT_TOKEN_SECRET_ID }}" --secret-string "$TG_BOT_TOKEN" --region ${{ env.TAILSCALE_AUTH_TOKEN_REGION }};
           else
             aws secretsmanager put-secret-value --secret-id "${{ env.TG_BOT_TOKEN_SECRET_ID }}" --secret-string "$TG_BOT_TOKEN" --region ${{ env.TAILSCALE_AUTH_TOKEN_REGION }};
           fi
      - name: Deploy Cloud Formation Stack
        id: deploy-cfn-stack
        if: ${{ github.event.inputs.run-cfn-deploy == 'true' }}
        uses: aws-actions/aws-cloudformation-github-deploy@v1.3.0
        with:
          name: ${{ env.STACK_NAME }}
          template: cloudformation/ecs-vpn-server.yml
          no-fail-on-empty-changeset: "1"
          parameter-overrides: 'EcsClusterName=${{ github.event.inputs.cluster-name }},EcrRepositoryName=${{ github.event.inputs.repository-name }},TailscaleAuthTokenSecretId=${{ env.TAILSCALE_AUTH_TOKEN_SECRET_ID }},TailscaleAuthTokenSecretRegion=${{ env.TAILSCALE_AUTH_TOKEN_REGION }},TgBotTokenSecretId=${{ env.TG_BOT_TOKEN_SECRET_ID }}'
      - name: Register Region In DynamoDB
        id: register-region
        if: ${{ github.event.inputs.run-cfn-deploy == 'true' }}
        run: |
          aws cloudformation describe-stacks --stack-name ${{ env.STACK_NAME }} --query 'Stacks[0].Outputs' --output json > ./stack-outputs.json
          ITEM=$(.github/scripts/region-item.sh "${{ github.event.inputs.region }}" ./stack-outputs.json)
          echo "$ITEM"
          aws dynamodb put-item --table-name "${{ env.CONFIG_TABLE_NAME }}" --region "${{ env.CONFIG_TABLE_REGION }}" --item "$ITEM"
      - name: Login to Amazon ECR
        id: login-to-ecr
        if: ${{ github.event.inputs.run-docker == 'true' }}
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build, tag, and push the image to Amazon ECR
        id: build-image
        if: ${{ github.event.inputs.run-docker == 'true' }}
        env:
          ECR_REPOSITORY: ${{ github.event.inputs.repository-name }}
          BUILD_TAG: ${{ github.run_number }}
        run: |
          ECR_REPO_URL=$(aws cloudformation describe-stacks --stack-name ${{ env.STACK_NAME }} --query 'Stacks[0].Outputs[?OutputKey==`EcrRepositoryUrl`].OutputValue' --output text)
           docker build \
            -t $ECR_REPO_URL:$BUILD_TAG \
            -t $ECR_REPO_URL:latest \
            ./docker/;
          docker push $ECR_REPO_URL:$BUILD_TAG
          docker push $ECR_REPO_URL:latest