name: Deploy VPN Configurer Lambda Resources

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'AWS Region'
        required: true
        default: eu-central-1
      lambda-source-version:
        description: 'Source code version of the lambda'
        required: true
        default: 2.0-SNAPSHOT

env:
  TG_BOT_USERNAME: ${{ vars.TG_BOT_USERNAME }}
  TG_SECRET_TOKEN_ID: ${{ vars.TG_SECRET_TOKEN_ID }}
  TG_BOT_TOKEN_SECRET_ID: ${{ vars.TG_BOT_TOKEN_SECRET_ID || 'vpn-tg-bot-token' }}
  METRICS_ENABLED: ${{ vars.METRICS_ENABLED || 'true' }}
  CONFIG_CACHE_TTL_SEC: ${{ vars.CONFIG_CACHE_TTL_SEC || '300' }}
  CONFIG_CACHE_ENABLED: ${{ vars.CONFIG_CACHE_ENABLED || 'false' }}
  TG_ROOT_USERNAME: ${{ vars.TG_ROOT_USERNAME }}
  S3_CONFIG_BUCKET_NAME: ${{ vars.S3_CONFIG_BUCKET_NAME }}
  CONFIG_TABLE_NAME: vpnbot

jobs:
  deploy-vpn-configurer-lambda:
    name: Deploy CloudFormation For Telegram Bot Lambda
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ github.event.inputs.region }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Upload TG Secret Token
        id: tg-secret-upload
        run: |
          if [ $(aws secretsmanager describe-secret --secret-id "${{ env.TG_SECRET_TOKEN_ID }}" --region ${{ github.event.inputs.region }} >/dev/null 2>&1; echo $?) -ne 0 ]; then
             aws secretsmanager create-secret --name ${{ env.TG_SECRET_TOKEN_ID }} --secret-string "${{ secrets.TG_SECRET_TOKEN }}" --region ${{ github.event.inputs.region }};
          fi
      - name: Upload TG Bot Token
        id: tg-bot-token-upload
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          if [ $(aws secretsmanager describe-secret --secret-id "${{ env.TG_BOT_TOKEN_SECRET_ID }}" --region ${{ github.event.inputs.region }} >/dev/null 2>&1; echo $?) -ne 0 ]; then
             aws secretsmanager create-secret --name "${{ env.TG_BOT_TOKEN_SECRET_ID }}" --secret-string "$TG_BOT_TOKEN" --region ${{ github.event.inputs.region }};
          else
             aws secretsmanager put-secret-value --secret-id "${{ env.TG_BOT_TOKEN_SECRET_ID }}" --secret-string "$TG_BOT_TOKEN" --region ${{ github.event.inputs.region }};
          fi
      - name: Deploy Cloud Formation Stack
        id: deploy-cfn-stack
        uses: aws-actions/aws-cloudformation-github-deploy@v1.3.0
        with:
          name: vpn-tgbot-cfn
          template: cloudformation/vpn-configurer-lambda.yml
          no-fail-on-empty-changeset: "1"
          capabilities: CAPABILITY_IAM,CAPABILITY_NAMED_IAM
          parameter-overrides: 'LambdaConfigBucketName=${{ env.S3_CONFIG_BUCKET_NAME }},LambdaSourceVersion=${{ github.event.inputs.lambda-source-version }},EnvTgBotUsername=${{ env.TG_BOT_USERNAME }},EnvTgBotSecretTokenId=${{ env.TG_SECRET_TOKEN_ID }},EnvTgBotTokenSecretId=${{ env.TG_BOT_TOKEN_SECRET_ID }},EnvMetricsEnabled=${{ env.METRICS_ENABLED }},EnvConfigCacheTtlSec=${{ env.CONFIG_CACHE_TTL_SEC }},EnvConfigCacheEnabled=${{ env.CONFIG_CACHE_ENABLED }}'
      # A published version freezes the configuration too, so configuration changes go live only with a new one
      - name: Publish Version And Point Alias `live`
        run: .github/scripts/publish-live-version.sh vpnbot live
      - name: Bootstrap Root User In DynamoDB
        id: bootstrap-root-user
        run: |
          if [ -z "${{ env.TG_ROOT_USERNAME }}" ]; then
            echo "::warning::TG_ROOT_USERNAME is not set, skipping the root user bootstrap"
            exit 0
          fi
          # Creates the root user only if it doesn't exist yet (never overwrites permissions)
          if aws dynamodb put-item --table-name "${{ env.CONFIG_TABLE_NAME }}" --region ${{ github.event.inputs.region }} \
               --item '{"pk":{"S":"USER"},"sk":{"S":"${{ env.TG_ROOT_USERNAME }}"},"permissions":{"SS":["ROOT_ACCESS"]}}' \
               --condition-expression 'attribute_not_exists(pk)' 2> ./put-item-error.txt; then
            echo "Root user '${{ env.TG_ROOT_USERNAME }}' created"
          elif grep -q ConditionalCheckFailedException ./put-item-error.txt; then
            echo "Root user '${{ env.TG_ROOT_USERNAME }}' already exists"
          else
            cat ./put-item-error.txt
            exit 1
          fi

      - name: Register Telegram bot commands
        id: register-bot-commands
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          curl -sS --fail -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/setMyCommands" \
            -H 'Content-Type: application/json' \
            -d '{"commands":[{"command":"menu","description":"Open the menu"},{"command":"help","description":"List all text commands"}]}'
          curl -sS --fail -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/setMyCommands" \
            -H 'Content-Type: application/json' \
            -d '{"commands":[{"command":"menu","description":"Открыть меню"},{"command":"help","description":"Список текстовых команд"}],"language_code":"ru"}'
