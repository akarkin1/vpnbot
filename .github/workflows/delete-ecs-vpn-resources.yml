name: Delete ECS VPN Server

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'AWS Region'
        required: true
      ecr-repository-name:
        description: 'Name Of ECR Repository, where Docker images of VPN Server are stored'
        required: true
        default: tailscale-node-ecr-repo

env:
  CONFIG_TABLE_NAME: vpnbot
  CONFIG_TABLE_REGION: ${{ vars.CONFIG_BASE_REGION }}
  STACK_NAME: ${{ vars.ECS_STACK_NAME }}

jobs:
  delete-cloudformation-stack:
    name: Delete CloudFormation stack
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ github.event.inputs.region }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # First, so the bot stops offering the region before its stack goes (deleting a missing item is a no-op)
      - name: Remove Region From DynamoDB
        run: |
          aws dynamodb delete-item --table-name "${{ env.CONFIG_TABLE_NAME }}" --region "${{ env.CONFIG_TABLE_REGION }}" \
            --key '{"pk":{"S":"REGION"},"sk":{"S":"${{ github.event.inputs.region }}"}}'
      - name: Clean UP ECR Repository
        if: ${{ github.event.inputs.ecr-repository-name != '' }}
        run: |
          aws ecr batch-delete-image --region ${{ github.event.inputs.region }} \
              --repository-name ${{ github.event.inputs.ecr-repository-name }} \
              --image-ids "$(aws ecr list-images --region ${{ github.event.inputs.region }} \
              --repository-name ${{ github.event.inputs.ecr-repository-name }} \
              --query 'imageIds[*]' --output json \
          )" || true
      - name: Delete CloudFormation Stack
        run: |
          aws cloudformation delete-stack --stack-name ${{ env.STACK_NAME }}
