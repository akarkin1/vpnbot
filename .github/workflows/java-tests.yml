name: Java Tests

on:
  pull_request:
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/scripts/**'
      - 'scripts/**'
      - '.github/workflows/java-tests.yml'
  workflow_dispatch:

jobs:
  java-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Build And Test
        run: mvn -B verify

      - name: Shell Script Tests
        run: |
          .github/scripts/region-item-test.sh
          .github/scripts/publish-live-version-test.sh
          scripts/migrate-pending-users-test.sh
